name: hlsdl build

on: [push, pull_request]

jobs:
  build-macos:

    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v1
    - name: make
      run: make
    - name: download testfile
      run: ./hlsdl -b -o test.ts "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8"
    - name: verify testfile
      run: echo "6bf11a9a4be02443d4790e43e6569a614128bad453c5cb327ec74031f6ea6382  test.ts" | shasum -a256 -c
    - name: download fmp4 testfile (EXT-X-MAP + BYTERANGE)
      run: ./hlsdl -b -o test_fmp4.mp4 "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"
    - name: verify fmp4 testfile starts with an ftyp box
      run: |
        test -s test_fmp4.mp4
        dd if=test_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp

  build-ubuntu:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: update apt
      run: sudo apt update
    - name: install libcurl libcrypto ffmpeg
      run: sudo apt -y install libcurl4-openssl-dev libssl-dev ffmpeg
    - name: make
      run: make
    - name: download testfile
      run: ./hlsdl -b -o test.ts "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8"
    - name: verify testfile
      run: echo "6bf11a9a4be02443d4790e43e6569a614128bad453c5cb327ec74031f6ea6382  test.ts" | shasum -a256 -c
    - name: download fmp4 testfile (EXT-X-MAP + BYTERANGE)
      run: ./hlsdl -b -o test_fmp4.mp4 "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"
    - name: verify fmp4 testfile is a playable mp4
      run: |
        set -eux
        test -s test_fmp4.mp4
        dd if=test_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
        # the -b variant maps a ~585 MB progressive file via BYTERANGE; a broken
        # quote-skip pulls that whole file in as the init AND appends the ranges
        bytes=$(stat -c%s test_fmp4.mp4)
        test "$bytes" -gt 50000000
        test "$bytes" -lt 800000000
        # -b muxes the default audio, but fMP4 + separate audio is video-only,
        # so a leaked audio init is the only way an audio stream turns up
        ffprobe -v error -show_entries stream=codec_type -of csv=p=0 test_fmp4.mp4 > streams.txt
        cat streams.txt
        grep -qE '^video' streams.txt
        ! grep -qE '^audio' streams.txt
    - name: fixture - fMP4 EXT-X-MAP (separate init file)
      run: |
        set -eux
        mkdir fx && cd fx
        ffmpeg -v error -f lavfi -i testsrc=d=6:s=128x72 -c:v libx264 -g 15 \
               -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
               -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 fmp4.m3u8
        cat fmp4.m3u8
        timeout 60 ../hlsdl -f -o out_fmp4.mp4 fmp4.m3u8
        dd if=out_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
        test "$(grep -a -o ftyp out_fmp4.mp4 | wc -l)" -eq 1
        ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_fmp4.mp4 | grep -q video
    - name: fixture - single-file fMP4 (EXT-X-MAP BYTERANGE, local path)
      run: |
        set -eux
        cd fx
        # concat the init + fragments into one file and hand-write a byte-range
        # playlist: #EXT-X-MAP:URI="blob.mp4",BYTERANGE="<n>@0" (quoted, unlike
        # #EXT-X-BYTERANGE). A broken quote-skip reads size 0 -> local 404.
        segs=$(grep -v '^#' fmp4.m3u8)
        cat init.mp4 $segs > blob.mp4
        isz=$(stat -c%s init.mp4)
        {
          printf '#EXTM3U\n#EXT-X-VERSION:7\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
          printf '#EXT-X-MAP:URI="blob.mp4",BYTERANGE="%d@0"\n' "$isz"
          off=$isz
          for s in $segs; do
            sz=$(stat -c%s "$s")
            printf '#EXTINF:1.0,\n#EXT-X-BYTERANGE:%d@%d\nblob.mp4\n' "$sz" "$off"
            off=$((off + sz))
          done
          printf '#EXT-X-ENDLIST\n'
        } > sf.m3u8
        cat sf.m3u8
        timeout 60 ../hlsdl -f -o out_sf.mp4 sf.m3u8
        dd if=out_sf.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
        # hlsdl just re-reads the byte ranges in order -> exactly blob.mp4
        cmp -s out_sf.mp4 blob.mp4
    - name: fixture - live fMP4, -s 0 keeps the EXT-X-MAP
      run: |
        set -eux
        cd fx
        # a live playlist (no ENDLIST); 2 s segments so -i 1 stops hlsdl cleanly
        # (exit 0, file flushed) right after the init segment instead of
        # spinning on the static playlist until a timeout kill
        sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' fmp4.m3u8 > live_fmp4.m3u8
        cat live_fmp4.m3u8
        python3 -m http.server 8199 &
        srv=$!
        sleep 1
        timeout 30 ../hlsdl -f -s 0 -i 1 -e 1 -o out_live_fmp4.mp4 "http://127.0.0.1:8199/live_fmp4.m3u8" || true
        kill $srv 2>/dev/null || true
        ls -l out_live_fmp4.mp4
        # -i 1 stops hlsdl right after the init segment, before the first
        # trimmed media segment is written -> the output must be exactly the
        # EXT-X-MAP init. A broken trim frees that head and the output starts
        # with a media fragment (styp / no ftyp) instead.
        dd if=out_live_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
        cmp -s out_live_fmp4.mp4 init.mp4
    - name: fixture - TS with a mid-stream EXT-X-DISCONTINUITY
      run: |
        set -eux
        cd fx
        ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video -f mpegts d0.ts
        ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video -f mpegts d1.ts
        ffmpeg -v error -f lavfi -i testsrc=d=1:s=64x48  -c:v mpeg2video -f mpegts d2.ts
        printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nd0.ts\n#EXTINF:1.0,\nd1.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nd2.ts\n#EXT-X-ENDLIST\n' > disc.m3u8
        timeout 60 ../hlsdl -f -o out_disc.ts disc.m3u8
        ffprobe -v error -show_entries format=format_name -of csv=p=0 out_disc.ts | grep -q .
